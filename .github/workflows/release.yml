name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: openrune-webserver-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build shadow JAR
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon --stacktrace

      - name: Verify JAR output
        run: test -f build/libs/openrune-server.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrune-server-jar
          path: build/libs/openrune-server.jar
          retention-days: 7

      - name: Set release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="Release ${TAG}"
          else
            DATE="$(date -u +'%Y-%m-%d')"
            BRANCH="${GITHUB_REF_NAME}"
            BRANCH_TAG="$(echo "$BRANCH" | tr '/' '-')"
            SHORT_SHA="$(git rev-parse --short HEAD)"
            TAG="${DATE}-${BRANCH_TAG}-${SHORT_SHA}"
            NAME="${DATE} - ${BRANCH}"
          fi

          FULL_SHA="$(git rev-parse HEAD)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_url=${{ github.server_url }}/${{ github.repository }}/commit/${FULL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            OpenRune web server shadow JAR.

            **Commit:** [`${{ steps.meta.outputs.short_sha }}`](${{ steps.meta.outputs.commit_url }})

            ## Run
            ```bash
            java -jar openrune-server.jar <openRs2CacheId> <game> <environment> <port>
            ```
          files: build/libs/openrune-server.jar
          generate_release_notes: false

  deploy:
    name: Deploy to server
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_DIR: /opt/openrune-webserver
      DB_NAME: openrune
      DB_USER: openrune
      # One line per instance: name|game|environment|port|openrs2 cache id|api heap|ingest heap.
      # Add a row to run another stream; the units, timer and tunnel route follow from it.
      INSTANCES: |
        osrs|OLDSCHOOL|LIVE|8090|2727|2G|6G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: openrune-server-jar
          path: dist

      - name: Install JDK 17, PostgreSQL and the database
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.OPENRUNE_DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DB_PASSWORD
          script: |
            set -euo pipefail

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            DB_NAME="${{ env.DB_NAME }}"
            DB_USER="${{ env.DB_USER }}"

            mkdir -p "${DEPLOY_DIR}" "${DEPLOY_DIR}/logs" "${DEPLOY_DIR}/instances"

            # The discord bot on this box runs on JDK 11, so install 17 alongside it and pin the
            # unit to that path rather than changing the default `java`.
            if [ ! -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java ]; then
              apt-get update -y
              apt-get install -y openjdk-17-jdk-headless
            fi

            # jq escapes ingest log output into the Discord payload; curl posts it.
            apt-get install -y --no-install-recommends jq curl postgresql postgresql-contrib

            # cloudflared fronts every instance, so no API port is exposed to the internet.
            if ! command -v cloudflared >/dev/null 2>&1; then
              echo "Installing cloudflared..."
              arch="$(dpkg --print-architecture)"
              curl -fsSL -o /tmp/cloudflared.deb \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${arch}.deb"
              dpkg -i /tmp/cloudflared.deb
              rm -f /tmp/cloudflared.deb
            else
              echo "cloudflared already installed: $(cloudflared --version)"
            fi

            systemctl enable --now postgresql

            # Idempotent: the role and database are created once, the password re-applied every
            # deploy so rotating the secret only needs a re-run.
            sudo -u postgres psql -v ON_ERROR_STOP=1 <<SQL
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${DB_USER}') THEN
                CREATE ROLE ${DB_USER} LOGIN;
              END IF;
            END
            \$\$;
            ALTER ROLE ${DB_USER} WITH PASSWORD '${DB_PASSWORD}';
            SQL

            if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME}'" | grep -q 1; then
              sudo -u postgres createdb -O "${DB_USER}" "${DB_NAME}"
            fi

            # Stock defaults (128MB shared_buffers, 4MB work_mem) make the set-based merge in the
            # import spill to disk. These are the values the benchmarks in docs/BENCHMARKS.md used.
            PG_CONF="$(sudo -u postgres psql -tAc 'SHOW config_file')"
            if ! grep -q '^# openrune tuning' "${PG_CONF}"; then
            cat >> "${PG_CONF}" <<'PGCONF'

            # openrune tuning
            shared_buffers = 512MB
            work_mem = 48MB
            maintenance_work_mem = 256MB
            max_wal_size = 4GB
            PGCONF
              systemctl restart postgresql
            fi

      - name: Upload JAR and deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/openrune-server.jar,deploy/*"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Write config, install units, start instances and tunnel
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.OPENRUNE_DB_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENRUNE_ADMIN_TOKEN: ${{ secrets.OPENRUNE_ADMIN_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          CLOUDFLARE_TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
          INSTANCES: ${{ env.INSTANCES }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DB_PASSWORD,DISCORD_WEBHOOK_URL,OPENRUNE_ADMIN_TOKEN,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,CLOUDFLARE_TUNNEL_ID,CLOUDFLARE_TUNNEL_CREDENTIALS,INSTANCES
          script: |
            set -euo pipefail

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"

            # Shared by every instance and by the ingest script, so they cannot drift apart.
            # Anything game- or port-specific belongs in instances/<name>.env, not here.
            cat > "${DEPLOY_DIR}/openrune.env" <<EOF
            OPENRUNE_DATABASE_URL=jdbc:postgresql://localhost:5432/${{ env.DB_NAME }}
            OPENRUNE_DATABASE_USER=${{ env.DB_USER }}
            OPENRUNE_DATABASE_PASSWORD=${DB_PASSWORD}
            OPENRUNE_ADMIN_TOKEN=${OPENRUNE_ADMIN_TOKEN}
            OPENRUNE_DEPLOY_DIR=${DEPLOY_DIR}
            DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
            R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
            R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            R2_BUCKET_NAME=openrune
            R2_PUBLIC_BASE_URL=https://cdn.openrune.dev
            OPENRUNE_CDN_BUCKET=openrune
            OPENRUNE_CDN_BASE_URL=https://cdn.openrune.dev
            OPENRUNE_CDN_REGION=auto
            OPENRUNE_CDN_ENABLED=true
            EOF
            chmod 600 "${DEPLOY_DIR}/openrune.env"
            chmod 700 "${DEPLOY_DIR}/ingest.sh" "${DEPLOY_DIR}/backfill.sh"

            install -m 644 "${DEPLOY_DIR}/openrune-webserver@.service" /etc/systemd/system/
            install -m 644 "${DEPLOY_DIR}/openrune-ingest@.service" /etc/systemd/system/
            install -m 644 "${DEPLOY_DIR}/openrune-ingest@.timer" /etc/systemd/system/
            install -m 644 "${DEPLOY_DIR}/openrune-backfill@.service" /etc/systemd/system/
            install -m 644 "${DEPLOY_DIR}/cloudflared.service" /etc/systemd/system/
            systemctl daemon-reload

            # --- instances ------------------------------------------------------------------
            NAMES=""
            while IFS='|' read -r name game environment port cache_id heap ingest_heap; do
              [ -n "${name:-}" ] || continue
              NAMES="${NAMES} ${name}"
              cat > "${DEPLOY_DIR}/instances/${name}.env" <<EOF
            OPENRUNE_INSTANCE=${name}
            OPENRUNE_GAME=${game}
            OPENRUNE_ENVIRONMENT=${environment}
            OPENRUNE_PORT=${port}
            OPENRUNE_CACHE_ID=${cache_id}
            OPENRUNE_HEAP=${heap}
            OPENRUNE_INGEST_HEAP=${ingest_heap}
            EOF
              chmod 600 "${DEPLOY_DIR}/instances/${name}.env"
              systemctl enable "openrune-webserver@${name}"
              systemctl enable --now "openrune-ingest@${name}.timer"
              systemctl restart "openrune-webserver@${name}"
              echo "configured ${name} on :${port} (${game}/${environment})"
            done <<< "${INSTANCES}"

            # --- cloudflare tunnel ----------------------------------------------------------
            if [ -n "${CLOUDFLARE_TUNNEL_ID:-}" ] && [ -n "${CLOUDFLARE_TUNNEL_CREDENTIALS:-}" ]; then
              mkdir -p /etc/cloudflared
              creds="/etc/cloudflared/${CLOUDFLARE_TUNNEL_ID}.json"
              # Cloudflare hands out the same tunnel two ways: the credentials file written by
              # `cloudflared tunnel create` ({"AccountTag":..,"TunnelID":..,"TunnelSecret":..}), and
              # the connector token shown in the dashboard — base64 of {"a":..,"t":..,"s":..}.
              # `credentials-file:` only accepts the first, so a token is converted here instead of
              # failing with "Invalid JSON ... invalid character 'e'".
              if printf '%s' "${CLOUDFLARE_TUNNEL_CREDENTIALS}" | grep -q '^[[:space:]]*{'; then
                printf '%s' "${CLOUDFLARE_TUNNEL_CREDENTIALS}" > "${creds}"
              else
                tok="$(printf '%s' "${CLOUDFLARE_TUNNEL_CREDENTIALS}" | tr -d '[:space:]')"
                # base64 -d rejects unpadded input, and the dashboard sometimes strips the padding.
                case $(( ${#tok} % 4 )) in
                  2) tok="${tok}==" ;;
                  3) tok="${tok}=" ;;
                esac
                printf '%s' "${tok}" | base64 -d \
                  | jq -e '{AccountTag: .a, TunnelID: .t, TunnelSecret: .s}' > "${creds}"
              fi
              chmod 600 "${creds}"
              # An id that disagrees with the credential only fails later, when connecting, with a
              # much vaguer message than this one.
              actual_id="$(jq -r '.TunnelID' "${creds}")"
              if [ "${actual_id}" != "${CLOUDFLARE_TUNNEL_ID}" ]; then
                echo "CLOUDFLARE_TUNNEL_ID is ${CLOUDFLARE_TUNNEL_ID} but the credential is for ${actual_id}" >&2
                exit 1
              fi
              sed "s/TUNNEL_ID/${CLOUDFLARE_TUNNEL_ID}/g" "${DEPLOY_DIR}/cloudflared-config.yml" \
                > /etc/cloudflared/config.yml
              chmod 600 /etc/cloudflared/config.yml
              # Only checks the ingress rules — it does not read the credentials file or contact
              # Cloudflare, so a bad tunnel id or credential still validates cleanly.
              cloudflared --config /etc/cloudflared/config.yml tunnel ingress validate
              systemctl enable cloudflared
              # Which is why the credentials only fail here. Print the reason rather than leaving
              # the deploy to report "control process exited with error code" and nothing else.
              if ! systemctl restart cloudflared; then
                echo "cloudflared failed to start:"
                journalctl -u cloudflared -n 50 --no-pager
                exit 1
              fi
              echo "cloudflared restarted"
            else
              echo "CLOUDFLARE_TUNNEL_ID / _CREDENTIALS not set; skipping tunnel setup"
            fi

            # --- health -------------------------------------------------------------------
            # Fail the deploy if an instance does not come up, rather than reporting success blindly.
            while IFS='|' read -r name game environment port cache_id heap ingest_heap; do
              [ -n "${name:-}" ] || continue
              ok=0
              for i in $(seq 1 30); do
                if curl -fsS -m 3 "http://127.0.0.1:${port}/status" >/dev/null; then
                  echo "${name} healthy after ${i}s: $(curl -sS "http://127.0.0.1:${port}/status")"
                  ok=1
                  break
                fi
                sleep 1
              done
              if [ "${ok}" -ne 1 ]; then
                echo "${name} did not become healthy:"
                journalctl -u "openrune-webserver@${name}" -n 50 --no-pager
                exit 1
              fi
            done <<< "${INSTANCES}"

            systemctl list-timers 'openrune-ingest@*' --no-pager || true
            systemctl is-active cloudflared >/dev/null 2>&1 && cloudflared tunnel info "${CLOUDFLARE_TUNNEL_ID:-}" 2>/dev/null || true
